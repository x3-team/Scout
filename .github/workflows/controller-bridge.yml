name: Scout public controller bridge

on:
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: x3-team/SkillForge
          ref: 0df4b22fd8c01f526be3212acea362af2d52f1be
          path: .ci-skillforge
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Supervisor failures and actual public worker tests
        env:
          SKILLFORGE_ROOT: ${{ github.workspace }}/.ci-skillforge
        run: python -m unittest discover -s integration_tests -v
      - name: Four actual one-goal runs and canonical report validation
        run: python scripts/check_goal_bridge.py --skillforge-root .ci-skillforge --output-dir runs/goal-bridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-goal-bridge-${{ matrix.os }}-${{ matrix.python }}
          path: runs/goal-bridge/
          if-no-files-found: error
