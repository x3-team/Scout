name: Proposed integration contract fixtures

on:
  pull_request:
    paths:
      - 'docs/integration/**'
      - 'scripts/check_integration_contract.py'
      - 'scripts/check_contract_clock.py'
      - 'scripts/review_integration_contract.py'
      - 'scripts/contract_schema.py'
      - 'scripts/contract_fixtures.py'
      - 'scripts/contract_checks.py'
      - '.github/workflows/integration-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_integration_contract.py --examples-dir runs/contract-fixtures
      - run: python scripts/check_contract_clock.py --output runs/contract-clock-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: scout-contract-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runs/contract-clock-check.json
            runs/contract-draft3-check.json
            runs/contract-fixtures/
          if-no-files-found: error
